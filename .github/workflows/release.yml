name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume a draft or reconcile a published release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      build_date: ${{ steps.identity.outputs.build_date }}
      image: ${{ steps.identity.outputs.image }}
      published: ${{ steps.identity.outputs.published }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and branch ancestry
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v0.0.0|v0.0.0-*) echo "0.0.0 is not a releasable version" >&2; exit 1 ;;
          esac
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          git fetch --no-tags origin master
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          test -n "$release_sha"
          git merge-base --is-ancestor "$release_sha" origin/master
          case "$RELEASE_TAG" in
            *-*) ;;
            *)
              latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
              if test -n "$latest" && test "$latest" != "$RELEASE_TAG"; then
                test "$(printf '%s\n%s\n' "$latest" "$RELEASE_TAG" | sort -V | tail -1)" = "$RELEASE_TAG"
              fi
              ;;
          esac
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            case "$draft" in true|false) ;; *) echo 'The release must already exist' >&2; exit 1 ;; esac
          else
            test "$release_sha" = "$GITHUB_SHA"
            test "$draft" != false
          fi
          {
            echo "version=$RELEASE_TAG"
            echo "commit=$release_sha"
            echo "build_date=$(git show -s --format=%cI "$release_sha")"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "published=$([ "$draft" = false ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  assets:
    name: Build release assets
    needs: preflight
    if: github.event_name == 'push' || needs.preflight.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Reuse a complete draft asset set
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          reuse=false
          if test "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = true; then
            gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-names.txt
            if grep -Fx checksums.txt existing-names.txt && grep -Fx client-update-manifest.json existing-names.txt; then
              gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir existing-assets \
                --pattern 'rule-bot-client_*' --pattern checksums.txt --pattern client-update-manifest.json
              jq -e --arg version "$VERSION" --arg commit "$COMMIT" '.schema == 1 and .version == $version and .commit == $commit and (.assets | length == 18)' existing-assets/client-update-manifest.json
              test "$(find existing-assets -maxdepth 1 -type f | wc -l)" -eq 20
              (cd existing-assets && sha256sum -c checksums.txt)
              reuse=true
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.existing.outputs.reuse != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Install release packaging tools
        if: steps.existing.outputs.reuse != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq zip

      - name: Build deterministic archives and packages
        if: steps.existing.outputs.reuse != 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          BUILD_DATE: ${{ needs.preflight.outputs.build_date }}
        run: sh scripts/build-release.sh

      - name: Create or update draft release
        if: steps.existing.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ needs.preflight.outputs.version }}" >/dev/null 2>&1; then
            test "$(gh release view "${{ needs.preflight.outputs.version }}" --json isDraft --jq .isDraft)" = true
            gh release upload "${{ needs.preflight.outputs.version }}" dist/* --clobber
          else
            prerelease=()
            case "${{ needs.preflight.outputs.version }}" in *-*) prerelease+=(--prerelease) ;; esac
            gh release create "${{ needs.preflight.outputs.version }}" dist/* --draft --verify-tag --generate-notes --title "${{ needs.preflight.outputs.version }}" "${prerelease[@]}"
          fi

  image:
    name: Publish or reconcile container image
    needs: [preflight, assets]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.assets.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reuse an existing version image when resuming
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUBLISHED: ${{ needs.preflight.outputs.published }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          build=true
          if test "$EVENT" = workflow_dispatch; then
            if docker buildx imagetools inspect "$IMAGE:${VERSION#v}" >/dev/null 2>&1; then
              build=false
            elif test "$PUBLISHED" = true; then
              echo 'The published GHCR version image is missing' >&2
              exit 1
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        if: steps.plan.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            name=${{ needs.preflight.outputs.image }}
            name=${{ secrets.DOCKERHUB_USERNAME }}/rule-bot-client
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.preflight.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.preflight.outputs.version, '-') }}

      - name: Build and push exact two-platform image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            COMMIT=${{ needs.preflight.outputs.commit }}
            BUILD_DATE=${{ needs.preflight.outputs.build_date }}

      - name: Reconcile Docker Hub with GHCR image
        if: steps.plan.outputs.build != 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          GHCR_IMAGE: ${{ needs.preflight.outputs.image }}
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rule-bot-client
        run: |
          image_tag=${VERSION#v}
          digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$image_tag" | awk '$1 == "Digest:" { print $2; exit }')
          test -n "$digest"
          tags=(--tag "$DOCKERHUB_IMAGE:$image_tag")
          case "$VERSION" in
            *-*) ;;
            *) tags+=(--tag "$DOCKERHUB_IMAGE:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" "$GHCR_IMAGE@$digest"

  openwrt-assets:
    name: Build OpenWrt release assets
    needs: [preflight, assets]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.assets.result == 'success' &&
      needs.preflight.outputs.published != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/openwrt-release.yml
    with:
      commit: ${{ needs.preflight.outputs.commit }}
      version: ${{ needs.preflight.outputs.version }}

  publish:
    name: Publish draft release
    needs: [preflight, assets, image, openwrt-assets]
    if: >-
      always() &&
      needs.assets.result == 'success' &&
      needs.image.result == 'success' &&
      needs.openwrt-assets.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Upload OpenWrt assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${{ needs.preflight.outputs.version }}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name openwrt-release-assets --dir openwrt-release
          gh release upload "${{ needs.preflight.outputs.version }}" --repo "$GITHUB_REPOSITORY" openwrt-release/* --clobber
          gh release edit "${{ needs.preflight.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Remove this run's published intermediate artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "openwrt-variants" or .name == "openwrt-ipk" or .name == "openwrt-apk" or .name == "openwrt-release-assets") | .id' > artifact-ids.txt
          while read -r id; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --method DELETE
          done < artifact-ids.txt
