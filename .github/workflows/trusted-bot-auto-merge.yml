name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge Dependabot PRs
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out or execute pull-request code with this write token.
      - name: Merge current Dependabot updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          pull_requests=$(
            gh api --paginate \
              "repos/$REPOSITORY/pulls?state=open&base=$default_branch&sort=created&direction=asc&per_page=100" \
              --jq '.[] | select(.user.login == "dependabot[bot]") | .number'
          )

          while IFS= read -r pull_number; do
            test -n "$pull_number" || continue
            # GitHub may need a moment to calculate mergeability after a push.
            for attempt in 1 2 3; do
              pull=$(gh api "repos/$REPOSITORY/pulls/$pull_number")
              if test "$(jq -r '.mergeable' <<<"$pull")" != null; then
                break
              fi
              sleep 2
            done

            jq -e --arg repository "$REPOSITORY" --arg branch "$default_branch" '
              .state == "open" and .draft == false and
              .user.login == "dependabot[bot]" and .user.type == "Bot" and
              .base.ref == $branch and .base.repo.full_name == $repository and
              .head.repo.full_name == $repository and
              (.head.ref | startswith("dependabot/"))
            ' <<<"$pull" >/dev/null || continue

            if test "$(jq -r '.mergeable' <<<"$pull")" != true; then
              echo "PR #$pull_number is not mergeable yet; a Dependabot update or scheduled run will retry"
              continue
            fi

            head_sha=$(jq -r '.head.sha' <<<"$pull")
            title=$(jq -r '.title' <<<"$pull")
            if ! result=$(gh api --method PUT "repos/$REPOSITORY/pulls/$pull_number/merge" \
              -f merge_method=squash \
              -f sha="$head_sha" \
              -f commit_title="$title (#$pull_number)" 2>&1); then
              echo "::warning::PR #$pull_number could not be merged: $result"
              continue
            fi
            jq -e '.merged == true' <<<"$result" >/dev/null
            echo "Merged Dependabot PR #$pull_number at $head_sha"
          done <<<"$pull_requests"

          echo "Dependabot queue reconciliation completed"
