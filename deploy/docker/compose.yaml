services:
  rule-bot-client:
    image: ghcr.io/aethersailor/rule-bot-client:latest
    container_name: rule-bot-client
    user: "10001:10001"
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    volumes:
      - /opt/rule-bot-client:/data
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
